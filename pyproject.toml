[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "image-complexity-segmentation"
version = "0.1.0"
description = "Framework for pixel-wise image segmentation based on local structural complexity."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pillow",
]


[tool.setuptools.packages.find]
where = ["src"]


[project.scripts]
complexity-seg = "complexity_seg.ui:run_app"